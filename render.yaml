# Render Blueprint for the FlowSpace API (the website is on Netlify).
# Render dashboard -> New -> Blueprint -> pick this repo, then paste MONGO_URL.
services:
  - type: web
    name: flowspace-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: BASE_PATH
        value: /api
      - key: MONGO_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://flowspace-rahul.netlify.app
      - key: FRONTEND_GOOGLE_CALLBACK_URL
        value: https://flowspace-rahul.netlify.app/google/oauth/callback
      # Google login is off in production; the strategy still needs values.
      - key: GOOGLE_CLIENT_ID
        value: not-configured
      - key: GOOGLE_CLIENT_SECRET
        value: not-configured
      - key: GOOGLE_CALLBACK_URL
        value: https://flowspace-rahul.netlify.app/api/auth/google/callback
