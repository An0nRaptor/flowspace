# Netlify serves the React app and proxies the API to the Render backend,
# so the browser only talks to one origin (cookies just work, no CORS).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_BASE_URL = "/api"

[[redirects]]
  from = "/api/*"
  to = "https://flowspace-api-tdnh.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/socket.io/*"
  to = "https://flowspace-api-tdnh.onrender.com/socket.io/:splat"
  status = 200
  force = true

# React Router: every other path loads the app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
